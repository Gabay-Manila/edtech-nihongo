<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美文字＆漢字 練習アプリ｜すうじ・かな・漢字129字</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body, button, input { font-family: 'Kiwi Maru', 'Hiragino Mincho ProN', serif; }
    canvas { touch-action: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .badge-dot { position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:9999px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- ヘッダー / モード・言語切り替え -->
  <header class="w-full max-w-sm flex justify-between items-center bg-white p-2.5 rounded-xl shadow-sm border border-slate-200 gap-1">
    <button id="btn-lang" class="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-1">
      🌐 <span id="lang-label">JP</span>
    </button>
    <div class="flex gap-1">
      <button id="btn-num" class="px-2 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold">123</button>
      <button id="btn-hira" class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">あ</button>
      <button id="btn-kata" class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">ア</button>
      <button id="btn-kanji" class="px-2 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">漢</button>
    </div>
  </header>

  <!-- サブタブ（清音・濁音・拗音） / ページタブ（漢字グループ） -->
  <div id="sub-tabs" class="w-full max-w-sm flex gap-1.5 mt-2"></div>
  <div id="page-tabs" class="w-full max-w-sm hidden flex gap-1.5 mt-2 overflow-x-auto no-scrollbar py-0.5"></div>

  <!-- メイン練習エリア -->
  <main class="w-full max-w-sm flex flex-col items-center gap-2.5 my-auto">

    <!-- かな／すうじ用: 書き方のアドバイスカード -->
    <div id="notice-card" class="w-full bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-900 flex justify-between items-center min-h-[64px]">
      <div class="pr-2">
        <span id="ui-tip-title" class="font-bold text-amber-800 block">💡 きれいに書くポイント：</span>
        <span id="notice-text">時計回りに丸く1筆で書ききります。</span>
      </div>
      <div id="compare-box" class="flex-shrink-0 flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-amber-200 font-bold text-base">
      </div>
    </div>

    <!-- 漢字用: 読み方・意味カード -->
    <div id="kanji-notice-card" class="hidden w-full bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-900 flex justify-between items-start min-h-[70px] gap-2">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 mb-1">
          <span id="id-badge" class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">No.1</span>
          <span id="stroke-badge" class="bg-slate-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">4画</span>
        </div>
        <span id="ui-reading-title" class="font-bold text-amber-800 block">読み方：</span>
        <span id="reading-text">ひ / にち / か</span>
        <span id="ui-meaning-title" class="font-bold text-amber-800 block mt-1">意味・例：</span>
        <span id="meaning-text">日、曜日、日付 ／ 日曜日（にちようび）</span>
      </div>
      <div id="kanji-compare-box" class="flex-shrink-0 flex items-center gap-1 bg-white px-2 py-1 rounded-lg border border-amber-200 font-bold text-2xl text-indigo-700"></div>
    </div>

    <!-- なぞり書きキャンバス領域 -->
    <div class="relative w-full aspect-square bg-white rounded-2xl shadow-md border-2 border-indigo-100 overflow-hidden flex items-center justify-center">

      <!-- 十字＋対角線ガイド（米字） -->
      <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="50" y1="0" x2="50" y2="100" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="0" y1="0" x2="100" y2="100" stroke="#eef2f7" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="100" y1="0" x2="0" y2="100" stroke="#eef2f7" stroke-width="0.5" stroke-dasharray="2,2"/>
      </svg>

      <!-- 背景のなぞりガイド文字（すうじ／かな用） -->
      <span id="char-guide" class="text-[180px] text-slate-300 select-none pointer-events-none z-0 opacity-60 leading-none">0</span>

      <!-- 漢字用: 静的な字形ガイド（KanjiVGストローク） -->
      <svg id="guide-strokes" class="absolute inset-0 w-full h-full pointer-events-none z-0 hidden" viewBox="0 0 109 109"></svg>
      <!-- 漢字用: 筆順アニメーション層 -->
      <svg id="anim-strokes" class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 109 109"></svg>

      <!-- 手書きキャンバス -->
      <canvas id="draw-canvas" class="absolute inset-0 z-20 cursor-crosshair w-full h-full"></canvas>

      <!-- 練習回数・スコア表示 -->
      <div id="stats-pill" class="absolute top-2 left-2 z-30 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-[10px] font-bold text-slate-500 border border-slate-200 flex flex-col leading-tight">
        <span id="stats-attempts">れんしゅう 0かい</span>
        <span id="stats-best">さいこう —</span>
      </div>

      <!-- 採点フィードバック（オーバーレイ） -->
      <div id="score-toast" class="absolute inset-x-2 bottom-2 z-30 hidden text-center font-bold text-sm py-1.5 rounded-lg shadow"></div>
    </div>

    <!-- ペンの太さ調整 -->
    <div class="w-full flex items-center gap-2 px-1">
      <span id="ui-pen-label" class="text-[10px] text-slate-500 font-bold whitespace-nowrap">ペンの太さ</span>
      <input id="pen-width" type="range" min="6" max="24" value="14" class="w-full accent-indigo-600">
    </div>

    <!-- 漢字専用: 筆順を見る -->
    <button id="btn-stroke-order" class="hidden w-full py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold rounded-xl shadow-sm text-xs flex items-center justify-center gap-1 active:scale-95 transition">
      ▶ <span id="ui-btn-stroke">筆順を見る</span>
    </button>

    <!-- アクションボタン -->
    <div class="w-full flex justify-between gap-1.5">
      <button id="btn-back" class="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl shadow-sm text-[11px] sm:text-xs flex items-center justify-center gap-1 active:scale-95 transition">
        ← <span id="ui-btn-back">戻る</span>
      </button>
      <button id="btn-audio" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-sm text-[11px] sm:text-xs flex items-center justify-center gap-1 active:scale-95 transition">
        🔊 <span id="ui-btn-audio">発音</span>
      </button>
      <button id="btn-next" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-sm text-[11px] sm:text-xs flex items-center justify-center gap-1 active:scale-95 transition">
        <span id="ui-btn-next">次へ</span> →
      </button>
    </div>
    <div class="w-full flex justify-between gap-1.5">
      <button id="btn-clear" class="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl shadow-sm text-[11px] sm:text-xs flex items-center justify-center gap-1 active:scale-95 transition">
        🗑️ <span id="ui-btn-clear">消す</span>
      </button>
      <button id="btn-score" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-sm text-[11px] sm:text-xs flex items-center justify-center gap-1 active:scale-95 transition">
        ✏️ <span id="ui-btn-score">採点する</span>
      </button>
    </div>

    <!-- 進捗シェア -->
    <div class="w-full bg-white border border-slate-200 rounded-xl p-2.5 flex flex-col gap-1.5">
      <input id="user-name" type="text" placeholder="お名前（にんい）" class="w-full text-xs px-2.5 py-2 rounded-lg border border-slate-200 outline-none focus:border-indigo-400">
      <button id="btn-share" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm text-xs flex items-center justify-center gap-1 active:scale-95 transition">
        📤 <span id="ui-btn-share">進捗をLINE WORKSに共有</span>
      </button>
    </div>

  </main>

  <!-- 全文字をフリックで選べる横スクロールバー -->
  <footer class="w-full max-w-sm bg-white p-2 rounded-xl shadow-sm border border-slate-200">
    <div id="char-selector" class="flex gap-2 overflow-x-auto py-1 no-scrollbar"></div>
    <p id="kanji-credit" class="hidden text-center text-[9px] text-slate-300 mt-1.5">Stroke data: KanjiVG (CC BY-SA 3.0) — kanjivg.tagaini.net</p>
  </footer>

  <script>
    /* ============================================================
       DATA — kana / numbers (unchanged from the nazori app)
       ============================================================ */
    let currentLang = 'ja';
    let currentMode = 'num';   // num | hira | kata | kanji
    let currentSub = 'all';    // all | seion | daku | youon  (kana modes only)
    let kanaIndex = 0;         // index within dataset[mode][sub]  (kana modes)
    let kanjiIndex = 0;        // global index into kanjiData      (kanji mode)
    let kanjiGroup = 0;        // page-group index (chunks of 20)  (kanji mode)
    let penWidth = 14;
    const GROUP_SIZE = 20;

    const uiText = {
      ja: {
        tipTitle: "💡 きれいに書くポイント：", readingTitle: "読み方：", meaningTitle: "意味・例：",
        audio: "発音", clear: "消す", next: "次へ", back: "戻る", score: "採点する", penLabel: "ペンの太さ",
        strokeBtn: "筆順を見る",
        subSeion: "清音", subDaku: "濁音・半濁音", subYouon: "拗音・促音",
        attempts: (n) => `れんしゅう ${n}かい`, best: (n) => n === null ? "さいこう —" : `さいこう ${n}てん`,
        scoreMsgGood: "とても読みやすいです！", scoreMsgOk: "だいたい合っています。もう少し練習しましょう。", scoreMsgBad: "ガイドとズレています。ゆっくりなぞってみましょう。",
        scoreHint: "（めやすのスコアです）",
        shareBtn: "進捗をLINE WORKSに共有", shareTitle: "美文字＆漢字 練習 進捗レポート",
        shareFallback: "この端末は直接共有に対応していないため、画像を保存しました。LINE WORKSに手動で添付してください。",
        shareNoData: "まだ練習記録がありません。先に何文字か練習してください。",
        weakTitle: "苦手な漢字 TOP5"
      },
      en: {
        tipTitle: "💡 Writing Tip:", readingTitle: "Reading:", meaningTitle: "Meaning / Example:",
        audio: "Audio", clear: "Clear", next: "Next", back: "Back", score: "Check", penLabel: "Pen size",
        strokeBtn: "Stroke order",
        subSeion: "Basic", subDaku: "Voiced", subYouon: "Contracted",
        attempts: (n) => `${n} attempts`, best: (n) => n === null ? "Best —" : `Best ${n}%`,
        scoreMsgGood: "Very readable, nice work!", scoreMsgOk: "Close, but keep practicing.", scoreMsgBad: "Off from the guide — try tracing slowly.",
        scoreHint: "(approximate score)",
        shareBtn: "Share progress to LINE WORKS", shareTitle: "Handwriting & Kanji Practice Report",
        shareFallback: "Direct sharing isn't supported on this device — the image was saved instead. Please attach it in LINE WORKS manually.",
        shareNoData: "No practice records yet. Practice a few characters first.",
        weakTitle: "Top 5 weakest kanji"
      }
    };

    // ===== 数字 0〜9 =====
    const numData = [
      { char: "0", notice_ja: "時計回りに1筆で丸く書きます。", notice_en: "Draw smoothly in one continuous clockwise loop.", bad: "Ø", good: "0" },
      { char: "1", notice_ja: "上のフック（かぎ）をつけず、まっすぐ書きます。", notice_en: "Draw a simple straight line without top hooks.", bad: "1(フック)", good: "1" },
      { char: "2", notice_ja: "上の丸みをきれいにつくり、下の横線を平らに引きます。", notice_en: "Make a neat curve at top and flat line at bottom.", bad: "", good: "2" },
      { char: "3", notice_ja: "2つの丸みを同じ大きさに揃えて書きます。", notice_en: "Keep the top and bottom loops equal in size.", bad: "", good: "3" },
      { char: "4", notice_ja: "上の交差部分をつき出さず、すっきり書きます。", bad: "4(交差)", good: "4", notice_en: "Keep the top vertical line clean without crossing." },
      { char: "5", notice_ja: "1画目の縦線と丸み、2画目の上の横線を分けて書きます。", notice_en: "Start with vertical down & loop, then add top line.", bad: "", good: "5" },
      { char: "6", notice_ja: "上から斜めに下ろし、下の丸みをきれいに閉じます。", notice_en: "Curve down gently and close the bottom loop neatly.", bad: "", good: "6" },
      { char: "7", notice_ja: "真ん中の横棒は書かず、シンプルな2段階の線で書きます。", notice_en: "Draw only two simple lines without a middle dash.", bad: "7(横棒)", good: "7" },
      { char: "8", notice_ja: "上の丸を少し小さめ、下の丸を大きめに書きます。", notice_en: "Make the top loop slightly smaller than the bottom.", bad: "", good: "8" },
      { char: "9", notice_ja: "上の丸をしっかり閉じてから、下へまっすぐ伸ばします。", notice_en: "Close top loop completely before bringing line down.", bad: "", good: "9" }
    ];

    const hiraSeion = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ","た","ち","つ","て","と","な","に","ぬ","ね","の","は","ひ","ふ","へ","ほ","ま","み","む","め","も","や","ゆ","よ","ら","り","る","れ","ろ","わ","を","ん"];
    const kataSeion = ["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ","タ","チ","ツ","テ","ト","ナ","ニ","ヌ","ネ","ノ","ハ","ヒ","フ","ヘ","ホ","マ","ミ","ム","メ","モ","ヤ","ユ","ヨ","ラ","リ","ル","レ","ロ","ワ","ヲ","ン"];
    const hiraDaku = ["が","ぎ","ぐ","げ","ご","ざ","じ","ず","ぜ","ぞ","だ","ぢ","づ","で","ど","ば","び","ぶ","べ","ぼ","ぱ","ぴ","ぷ","ぺ","ぽ"];
    const kataDaku = ["ガ","ギ","グ","ゲ","ゴ","ザ","ジ","ズ","ゼ","ゾ","ダ","ヂ","ヅ","デ","ド","バ","ビ","ブ","ベ","ボ","パ","ピ","プ","ペ","ポ"];
    const hiraYouon = ["きゃ","きゅ","きょ","しゃ","しゅ","しょ","ちゃ","ちゅ","ちょ","にゃ","にゅ","にょ","ひゃ","ひゅ","ひょ","みゃ","みゅ","みょ","りゃ","りゅ","りょ","ぎゃ","ぎゅ","ぎょ","じゃ","じゅ","じょ","びゃ","びゅ","びょ","ぴゃ","ぴゅ","ぴょ","っ"];
    const kataYouon = ["キャ","キュ","キョ","シャ","シュ","ショ","チャ","チュ","チョ","ニャ","ニュ","ニョ","ヒャ","ヒュ","ヒョ","ミャ","ミュ","ミョ","リャ","リュ","リョ","ギャ","ギュ","ギョ","ジャ","ジュ","ジョ","ビャ","ビュ","ビョ","ピャ","ピュ","ピョ","ッ","ー"];

    function makeItems(chars, jaFn, enFn) {
      return chars.map(c => ({ char: c, notice_ja: jaFn(c), notice_en: enFn(c), bad: "", good: c }));
    }

    const dataset = {
      num: { all: numData },
      hira: {
        seion: makeItems(hiraSeion, c => `「${c}」のバランスを意識して書きましょう。`, c => `Trace "${c}" carefully following the strokes.`),
        daku: makeItems(hiraDaku, c => `濁点・半濁点の位置を右上にそろえて書きます。`, c => `Keep the dakuten/handakuten marks aligned to the upper right.`),
        youon: makeItems(hiraYouon, c => c === "っ" ? `小さい「っ」は本来の大きさの半分ほどにします。` : `小さい「ゃゅょ」を右下に小さく書きます。`, c => c === "っ" ? `Write small "っ" about half the normal size.` : `Write the small "ゃゅょ" clearly smaller, tucked to the lower right.`)
      },
      kata: {
        seion: makeItems(kataSeion, c => `「${c}」のハネ・ハライに気をつけましょう。`, c => `Pay attention to sharp turns and releases in "${c}".`),
        daku: makeItems(kataDaku, c => `濁点・半濁点の位置を右上にそろえて書きます。`, c => `Keep the dakuten/handakuten marks aligned to the upper right.`),
        youon: makeItems(kataYouon, c => c === "ッ" ? `小さい「ッ」は本来の大きさの半分ほどにします。` : (c === "ー" ? `長音「ー」はまっすぐ横に1本、伸ばして書きます。` : `小さい「ャュョ」を右下に小さく書きます。`), c => c === "ッ" ? `Write small "ッ" about half the normal size.` : (c === "ー" ? `Draw the long-vowel mark as one straight horizontal stroke.` : `Write the small "ャュョ" clearly smaller, tucked to the lower right.`))
      }
    };

    function currentKanaList() {
      return dataset[currentMode][currentSub] || dataset[currentMode]['all'] || dataset[currentMode][Object.keys(dataset[currentMode])[0]];
    }

    /* ============================================================
       DATA — kanji (129 characters, KanjiVG stroke paths)

    function groupCount() { return Math.ceil(kanjiData.length / GROUP_SIZE); }
    function groupRange(g) {
      const start = g * GROUP_SIZE;
      const end = Math.min(kanjiData.length, start + GROUP_SIZE);
      return { start, end };
    }

    function isKanjiMode() { return currentMode === 'kanji'; }
    function currentItem() {
      return isKanjiMode() ? kanjiData[kanjiIndex] : currentKanaList()[kanaIndex];
    }

    /* ============================================================
       PROGRESS STORAGE — separate namespaces so existing progress
       from the two original apps carries over unchanged.
       ============================================================ */
    function progressKey() { return isKanjiMode() ? 'kanji_progress' : 'kaki_progress'; }
    function loadProgress(key) {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; }
    }
    function saveProgress(key, p) { localStorage.setItem(key, JSON.stringify(p)); }
    function getRecord(char) {
      const p = loadProgress(progressKey());
      return p[char] || { attempts: 0, best: null };
    }
    function recordAttempt(char, score) {
      const key = progressKey();
      const p = loadProgress(key);
      const rec = p[char] || { attempts: 0, best: null };
      rec.attempts += 1;
      rec.best = rec.best === null ? score : Math.max(rec.best, score);
      p[char] = rec;
      saveProgress(key, p);
      return rec;
    }

    // ===== 進捗の集計（すうじ／ひらがな／カタカナ／漢字） =====
    function aggregateStats() {
      const kanaProgress = loadProgress('kaki_progress');
      const kanjiProgress = loadProgress('kanji_progress');
      const groups = {
        num: dataset.num.all,
        hira: [...dataset.hira.seion, ...dataset.hira.daku, ...dataset.hira.youon],
        kata: [...dataset.kata.seion, ...dataset.kata.daku, ...dataset.kata.youon]
      };
      const result = {};
      Object.keys(groups).forEach(key => {
        const list = groups[key];
        let practiced = 0, mastered = 0, totalAttempts = 0, scoreSum = 0, scoreCount = 0;
        list.forEach(item => {
          const rec = kanaProgress[item.char];
          if (rec && rec.attempts > 0) {
            practiced++;
            totalAttempts += rec.attempts;
            if (rec.best !== null) {
              scoreSum += rec.best;
              scoreCount++;
              if (rec.best >= 70) mastered++;
            }
          }
        });
        result[key] = { total: list.length, practiced, mastered, totalAttempts, avgBest: scoreCount ? Math.round(scoreSum / scoreCount) : null };
      });

      // kanji
      let kPracticed = 0, kMastered = 0, kAttempts = 0, kScoreSum = 0, kScoreCount = 0;
      const scored = [];
      kanjiData.forEach(item => {
        const rec = kanjiProgress[item.char];
        if (rec && rec.attempts > 0) {
          kPracticed++;
          kAttempts += rec.attempts;
          if (rec.best !== null) {
            kScoreSum += rec.best;
            kScoreCount++;
            if (rec.best >= 70) kMastered++;
            scored.push({ char: item.char, id: item.id, best: rec.best });
          }
        }
      });
      scored.sort((a, b) => a.best - b.best);
      result.kanji = {
        total: kanjiData.length, practiced: kPracticed, mastered: kMastered, totalAttempts: kAttempts,
        avgBest: kScoreCount ? Math.round(kScoreSum / kScoreCount) : null, weakest: scored.slice(0, 5)
      };
      return result;
    }
    function hasAnyProgress(stats) {
      return ['num', 'hira', 'kata', 'kanji'].some(k => stats[k].practiced > 0);
    }

    const compareBox = document.getElementById('compare-box');
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const scoreToast = document.getElementById('score-toast');
    const statsAttempts = document.getElementById('stats-attempts');
    const statsBest = document.getElementById('stats-best');
    let isDrawing = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = penWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      scoreToast.classList.add('hidden');
    }
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    canvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    });
    window.addEventListener('pointerup', () => isDrawing = false);
    document.getElementById('pen-width').addEventListener('input', (e) => {
      penWidth = Number(e.target.value);
      ctx.lineWidth = penWidth;
    });

    function speak(text) {
      if ('speechSynthesis' in window) {
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 0.78;
        window.speechSynthesis.speak(uttr);
      }
    }

    // ===== 漢字: 字形ガイド描画 =====
    function renderGuideStrokes(item) {
      guideSvg.innerHTML = item.strokes.map(d =>
        `<path d="${d}" fill="none" stroke="#cbd5e1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`
      ).join('');
      animSvg.innerHTML = '';
    }

    // ===== 漢字: 筆順アニメーション =====
    let strokeAnimTimers = [];
    function playStrokeOrder() {
      if (!isKanjiMode()) return;
      const item = currentItem();
      strokeAnimTimers.forEach(t => clearTimeout(t));
      strokeAnimTimers = [];
      animSvg.innerHTML = '';

      const pathEls = item.strokes.map(d => {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d);
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke', '#4338ca');
        p.setAttribute('stroke-width', '3.6');
        p.setAttribute('stroke-linecap', 'round');
        p.setAttribute('stroke-linejoin', 'round');
        animSvg.appendChild(p);
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        return p;
      });

      const badges = [];
      if (item.numPos && item.numPos.length === item.strokes.length) {
        item.numPos.forEach(([x, y], i) => {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('opacity', '0');
          g.innerHTML = `<circle cx="${x}" cy="${y - 3}" r="6.5" fill="#4338ca"/><text x="${x}" y="${y - 3}" font-size="7.5" fill="#fff" text-anchor="middle" dominant-baseline="central" font-weight="bold">${i + 1}</text>`;
          animSvg.appendChild(g);
          badges.push(g);
        });
      }

      const perStroke = 480;
      pathEls.forEach((p, i) => {
        const t1 = setTimeout(() => {
          p.style.transition = `stroke-dashoffset ${Math.round(perStroke * 0.75)}ms ease-in-out`;
          p.style.strokeDashoffset = '0';
          if (badges[i]) {
            badges[i].style.transition = 'opacity 150ms';
            badges[i].style.opacity = '1';
          }
        }, i * perStroke);
        strokeAnimTimers.push(t1);
      });

      const totalTime = pathEls.length * perStroke + 900;
      const tEnd = setTimeout(() => { animSvg.innerHTML = ''; }, totalTime);
      strokeAnimTimers.push(tEnd);
    }

    // ===== 参考スコア（ガイド文字とインクの重なり具合のめやす、全モード共通） =====
    function computeMatchScore(char) {
      const w = canvas.width, h = canvas.height;
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const octx = off.getContext('2d');
      octx.fillStyle = '#000';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      const fontPx = h * 0.5;
      octx.font = `${fontPx}px 'Kiwi Maru', serif`;
      octx.fillText(char, w / 2, h / 2 + fontPx * 0.04);

      const guideData = octx.getImageData(0, 0, w, h).data;
      const userData = ctx.getImageData(0, 0, w, h).data;

      const grid = 28;
      const cellW = Math.max(1, Math.floor(w / grid));
      const cellH = Math.max(1, Math.floor(h / grid));
      let guideCells = 0, userCells = 0, overlapCells = 0;

      for (let gy = 0; gy < grid; gy++) {
        for (let gx = 0; gx < grid; gx++) {
          let gInk = false, uInk = false;
          for (let sy = 0; sy < cellH; sy += Math.max(1, Math.floor(cellH / 2))) {
            for (let sx = 0; sx < cellW; sx += Math.max(1, Math.floor(cellW / 2))) {
              const px = gx * cellW + sx, py = gy * cellH + sy;
              if (px >= w || py >= h) continue;
              const idx = (py * w + px) * 4;
              if (guideData[idx + 3] > 80) gInk = true;
              if (userData[idx + 3] > 80) uInk = true;
            }
          }
          if (gInk) guideCells++;
          if (uInk) userCells++;
          if (gInk && uInk) overlapCells++;
        }
      }
      if (userCells === 0) return 0;
      const recall = guideCells ? overlapCells / guideCells : 0;
      const precision = userCells ? overlapCells / userCells : 0;
      const score = Math.round((recall * 0.6 + precision * 0.4) * 100);
      return Math.max(0, Math.min(100, score));
    }

    function runScoring() {
      const item = currentItem();
      const score = computeMatchScore(item.char);
      const rec = recordAttempt(item.char, score);
      showScoreToast(score);
      updateStatsPill(rec);
      renderSelector();
    }

    function showScoreToast(score) {
      const t = uiText[currentLang];
      let msg, cls;
      if (score >= 70) { msg = t.scoreMsgGood; cls = 'bg-emerald-500 text-white'; }
      else if (score >= 45) { msg = t.scoreMsgOk; cls = 'bg-amber-500 text-white'; }
      else { msg = t.scoreMsgBad; cls = 'bg-rose-500 text-white'; }
      scoreToast.className = `absolute inset-x-2 bottom-2 z-30 text-center font-bold text-xs py-1.5 rounded-lg shadow ${cls}`;
      scoreToast.innerHTML = `${score}% ・ ${msg} <span class="font-normal opacity-80">${t.scoreHint}</span>`;
    }

    function updateStatsPill(rec) {
      const t = uiText[currentLang];
      statsAttempts.innerText = t.attempts(rec.attempts);
      statsBest.innerText = t.best(rec.best);
    }

       DISPLAY

        document.getElementById('ui-reading-title').innerText = t.readingTitle;
        document.getElementById('ui-meaning-title').innerText = t.meaningTitle;

        document.getElementById('meaning-text').innerText = `${item.meaning} ／ ${item.example}`;
        document.getElementById('kanji-compare-box').innerHTML = `<span>${item.char}</span>`;
        document.getElementById('kanji-count-label') && (document.getElementById('kanji-count-label').innerText = `${item.id} / ${kanjiData.length}`);

        renderGuideStrokes(item);
      } else {
        kanjiNoticeCard.classList.add('hidden');
        noticeCard.classList.remove('hidden');
        charGuideEl.classList.remove('hidden');
        guideSvg.classList.add('hidden');
        animSvg.innerHTML = '';
        document.getElementById('btn-stroke-order').classList.add('hidden');
        document.getElementById('kanji-credit').classList.add('hidden');
        document.getElementById('page-tabs').classList.add('hidden');
        document.getElementById('sub-tabs').classList.remove('hidden');

        document.getElementById('ui-tip-title').innerText = t.tipTitle;
        if (item.bad) {
          compareBox.innerHTML = `<span class="text-rose-500 line-through text-xs">${item.bad}</span> <span class="text-slate-400 text-xs">➔</span> <span class="text-emerald-600">${item.good}</span>`;
        } else {

      updateStatsPill(getRecord(item.char));

    // ===== サブタブ（清音・濁音・拗音）— かなモードのみ =====
    function renderSubTabs() {
      const container = document.getElementById('sub-tabs');
      if (isKanjiMode() || currentMode === 'num') { container.innerHTML = ''; container.classList.add('hidden'); return; }
      container.classList.remove('hidden');
      const t = uiText[currentLang];
      const subs = [
        { key: 'seion', label: t.subSeion },
        { key: 'daku', label: t.subDaku },
        { key: 'youon', label: t.subYouon }
      ];
      container.innerHTML = '';
      subs.forEach(s => {
        const btn = document.createElement('button');
        const active = s.key === currentSub;
        btn.className = `flex-1 py-1.5 rounded-lg text-[11px] font-bold border transition ${active ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}`;
        btn.innerText = s.label;
        btn.onclick = () => { currentSub = s.key; kanaIndex = 0; updateDisplay(); };
        container.appendChild(btn);
      });

    // ===== ページタブ（グループ20字ずつ）— 漢字モードのみ =====
    function renderPageTabs() {
      const container = document.getElementById('page-tabs');
      if (!isKanjiMode()) { container.innerHTML = ''; return; }
      container.innerHTML = '';
      const gc = groupCount();
      for (let g = 0; g < gc; g++) {
        const { start, end } = groupRange(g);
        const btn = document.createElement('button');
        const active = g === kanjiGroup;
        btn.className = `flex-shrink-0 px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition ${active ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}`;
        btn.innerText = `${start + 1}-${end}`;
        btn.onclick = () => { kanjiGroup = g; kanjiIndex = start; updateDisplay(); };
        container.appendChild(btn);
      }
    }

    // ===== 文字選択バー（練習回数バッジ付き） =====
    function renderSelector() {
      const container = document.getElementById('char-selector');
      container.innerHTML = '';

      if (isKanjiMode()) {
        const { start, end } = groupRange(kanjiGroup);
        for (let idx = start; idx < end; idx++) {
          const item = kanjiData[idx];
          const wrap = document.createElement('div');
          wrap.className = 'relative flex-shrink-0';
          const btn = document.createElement('button');
          const isSelected = idx === kanjiIndex;
          btn.className = `w-12 h-14 font-bold rounded-xl border flex flex-col items-center justify-center transition ${isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm scale-105' : 'bg-slate-50 text-slate-700 border-slate-200 active:bg-slate-100'}`;
          btn.innerHTML = `<span class="text-[8px] opacity-70 leading-none">${item.id}</span><span class="text-xl leading-tight">${item.char}</span>`;
          btn.onclick = () => { kanjiIndex = idx; updateDisplay(); speak(item.char); };
          wrap.appendChild(btn);
          const rec = getRecord(item.char);
          if (rec.attempts > 0) {
            const dot = document.createElement('span');
            const mastered = rec.best !== null && rec.best >= 70;
            dot.className = `badge-dot ${mastered ? 'bg-emerald-500' : 'bg-amber-400'} border border-white`;
            wrap.appendChild(dot);
          }
          container.appendChild(wrap);
        }
        return;
      }

      const list = currentKanaList();
      list.forEach((item, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'relative flex-shrink-0';
        const btn = document.createElement('button');
        const isSelected = idx === kanaIndex;
        btn.id = `char-btn-${idx}`;
        btn.className = `w-11 h-11 font-bold rounded-xl border text-base flex items-center justify-center transition ${isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm scale-105' : 'bg-slate-50 text-slate-700 border-slate-200 active:bg-slate-100'}`;
        btn.innerText = item.char;
        btn.onclick = () => { kanaIndex = idx; updateDisplay(); speak(item.char); };
        wrap.appendChild(btn);
        const rec = getRecord(item.char);
        if (rec.attempts > 0) {
          const dot = document.createElement('span');
          const mastered = rec.best !== null && rec.best >= 70;
          dot.className = `badge-dot ${mastered ? 'bg-emerald-500' : 'bg-amber-400'} border border-white`;
          wrap.appendChild(dot);
        }
        container.appendChild(wrap);
      });
      const activeBtn = document.getElementById(`char-btn-${kanaIndex}`);
      if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    /* ============================================================
       PROGRESS SHARE CARD (4 categories + weakest kanji)
       ============================================================ */
    function roundRectPath(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function buildProgressCard() {
      const stats = aggregateStats();
      const t = uiText[currentLang];
      const name = document.getElementById('user-name').value.trim();
      const dateStr = new Date().toLocaleDateString(currentLang === 'ja' ? 'ja-JP' : 'en-US');

      const panels = [
        { key: 'num', label: currentLang === 'ja' ? 'すうじ（0-9）' : 'Numbers (0-9)', color: '#4f46e5' },
        { key: 'hira', label: currentLang === 'ja' ? 'ひらがな' : 'Hiragana', color: '#059669' },
        { key: 'kata', label: currentLang === 'ja' ? 'カタカナ' : 'Katakana', color: '#d97706' },
        { key: 'kanji', label: currentLang === 'ja' ? '漢字（129字）' : 'Kanji (129)', color: '#db2777' }
      ];

      const weakest = stats.kanji.weakest;
      const W = 800, H = 190 + panels.length * 235 + (weakest.length ? 140 + weakest.length * 58 : 0) + 60;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const c = cvs.getContext('2d');

      c.fillStyle = '#f1f5f9';
      c.fillRect(0, 0, W, H);

      const grad = c.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0, '#4338ca');
      grad.addColorStop(1, '#6366f1');
      c.fillStyle = grad;
      c.fillRect(0, 0, W, 150);

      c.textBaseline = 'top';
      c.fillStyle = '#ffffff';
      c.font = 'bold 32px sans-serif';
      c.fillText(t.shareTitle, 40, 38);
      c.font = '20px sans-serif';
      c.fillStyle = 'rgba(255,255,255,0.85)';
      c.fillText(dateStr, 40, 92);
      if (name) {
        c.textAlign = 'right';
        c.font = 'bold 24px sans-serif';
        c.fillStyle = '#ffffff';
        c.fillText(name + (currentLang === 'ja' ? ' さん' : ''), W - 40, 92);
        c.textAlign = 'left';
      }

      let y = 190;
      panels.forEach(p => {
        const s = stats[p.key];
        roundRectPath(c, 40, y, W - 80, 210, 20);
        c.fillStyle = '#ffffff';
        c.fill();

        c.fillStyle = '#0f172a';
        c.font = 'bold 26px sans-serif';
        c.fillText(p.label, 70, y + 28);

        const barX = 70, barY = y + 78, barW = W - 220, barH = 22;
        roundRectPath(c, barX, barY, barW, barH, 11);
        c.fillStyle = '#e2e8f0';
        c.fill();
        const ratio = s.total ? s.practiced / s.total : 0;
        roundRectPath(c, barX, barY, Math.max(ratio > 0 ? barH : 0, barW * ratio), barH, 11);
        c.fillStyle = p.color;
        c.fill();

        c.fillStyle = '#334155';
        c.font = '20px sans-serif';
        const lbl1 = currentLang === 'ja' ? `練習済み ${s.practiced} / ${s.total} 文字` : `Practiced ${s.practiced} / ${s.total}`;
        const lbl2 = currentLang === 'ja' ? `のべ ${s.totalAttempts} 回` : `${s.totalAttempts} attempts`;
        const lbl3 = currentLang === 'ja' ? `平均スコア ${s.avgBest !== null ? s.avgBest + '%' : '—'}` : `Avg score ${s.avgBest !== null ? s.avgBest + '%' : '—'}`;
        const lbl4 = currentLang === 'ja' ? `習熟(70%以上) ${s.mastered} 文字` : `Mastered (≥70%) ${s.mastered}`;
        c.fillText(lbl1, barX, barY + 36);
        c.fillText(lbl2, barX, barY + 64);
        c.fillText(lbl3, barX, barY + 92);
        c.fillText(lbl4, barX + 320, barY + 92);

        y += 235;
      });

      if (weakest.length) {
        const panelH = 100 + weakest.length * 58;
        roundRectPath(c, 40, y, W - 80, panelH, 20);
        c.fillStyle = '#ffffff';
        c.fill();
        c.fillStyle = '#0f172a';
        c.font = 'bold 24px sans-serif';
        c.fillText(t.weakTitle, 70, y + 26);

        let ry = y + 70;
        weakest.forEach(w => {
          c.fillStyle = '#eef2ff';
          roundRectPath(c, 70, ry, W - 180, 50, 10);
          c.fill();
          c.fillStyle = '#4338ca';
          c.font = 'bold 30px serif';
          c.fillText(w.char, 88, ry + 8);
          c.fillStyle = '#334155';
          c.font = '18px sans-serif';
          c.fillText(`No.${w.id}`, 140, ry + 10);
          c.fillStyle = w.best >= 45 ? '#d97706' : '#e11d48';
          c.font = 'bold 20px sans-serif';
          c.textAlign = 'right';
          c.fillText(`${w.best}%`, W - 130, ry + 14);
          c.textAlign = 'left';
          ry += 58;
        });
      }

      c.fillStyle = '#94a3b8';
      c.font = '15px sans-serif';
      c.fillText('Yoshida EdTech Works ・ EdTech Gabay ・ Stroke data: KanjiVG (CC BY-SA 3.0)', 40, H - 34);

      return { canvas: cvs, hasData: hasAnyProgress(stats) };
    }

    async function shareProgress() {
      const t = uiText[currentLang];
      const { canvas: cardCanvas, hasData } = buildProgressCard();
      if (!hasData) { alert(t.shareNoData); return; }

      cardCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const dateTag = new Date().toISOString().slice(0, 10);
        const file = new File([blob], `moji-kanji-progress-${dateTag}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: t.shareTitle }); } catch (err) { /* cancelled */ }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          alert(t.shareFallback);
        }
      }, 'image/png');
    }

       BUTTONS

    const nameInput = document.getElementById('user-name');
    nameInput.value = localStorage.getItem('kaki_username') || '';
    nameInput.addEventListener('change', () => {
      localStorage.setItem('kaki_username', nameInput.value.trim());
    });

    // ===== 初期化 =====
    window.addEventListener('resize', resizeCanvas);
    setTimeout(() => {
      resizeCanvas();
      updateDisplay();
    }, 100);
  </script>
</body>
</html>
