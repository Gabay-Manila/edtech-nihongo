<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edtech-nihongo | Adaptive Survival Japanese</title>
<meta name="description" content="English-first adaptive Japanese learning — 4 blocks, AI Support hints, weak-point review loop.">

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<style>
  :root{
    --bg:#fdfcf0;
    --card:#fffefa;
    --ink:#2b2a25;
    --ink-soft:#6b6a5e;
    --line:#e7e3cf;
    --umi:#2f4858;          /* deep indigo-sea — primary accent */
    --umi-soft:#dfe7ea;
    --sun:#c1572f;          /* terracotta — CTA / hint accent */
    --sun-soft:#f6e3d8;
    --good:#5c7a52;
    --good-soft:#e7efe1;
    --bad:#a64b42;
    --bad-soft:#f3e3e0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .jp{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    padding:22px 18px 60px;
    min-height:100vh;
  }
  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .brand{
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .brand b{color:var(--umi);}
  .tonefreq{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .wave{
    width:100%;
    height:18px;
    margin:10px 0 26px;
    display:block;
  }
  /* ---------- home screen ---------- */
  .hero h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  .hero p{
    color:var(--ink-soft);
    margin:0 0 22px;
    font-size:15px;
    max-width:540px;
  }
  .islands{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:480px){
    .islands{grid-template-columns:1fr;}
  }
  .island{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px;
    cursor:pointer;
    text-align:left;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 1px 0 rgba(43,42,37,.03);
  }
  .island:hover{
    transform:translateY(-2px);
    border-color:var(--umi);
    box-shadow:0 8px 20px -10px rgba(47,72,88,.35);
  }
  .island:focus-visible{outline:3px solid var(--umi);outline-offset:2px;}
  .island .lvl{
    display:inline-block;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--umi);
    background:var(--umi-soft);
    padding:3px 8px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .island h2{
    margin:0 0 4px;
    font-size:19px;
  }
  .island .jp-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .island .meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .island .best{color:var(--good);font-weight:600;}
  /* ---------- quiz screen ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .back-link{
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    background:none;
    border:none;
    padding:6px 0;
  }
  .back-link:hover{color:var(--umi);}
  .progress-track{
    height:6px;
    background:var(--umi-soft);
    border-radius:999px;
    overflow:hidden;
    margin:10px 0 20px;
  }
  .progress-fill{
    height:100%;
    background:var(--umi);
    border-radius:999px;
    transition:width .25s ease;
  }
  .review-banner{
    background:var(--sun-soft);
    border:1px solid var(--sun);
    color:#7a3216;
    font-size:13px;
    padding:8px 12px;
    border-radius:10px;
    margin-bottom:16px;
  }
  .situation-en{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--umi-soft);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .situation-en b{color:var(--umi);}
  .prompt-jp{
    font-size:22px;
    margin:0 0 18px;
    line-height:1.5;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }
  .choice{
    text-align:left;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:13px 16px;
    font-size:17px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover:not(:disabled){border-color:var(--umi);}
  .choice:disabled{cursor:default;}
  .choice.correct{
    background:var(--good-soft);
    border-color:var(--good);
  }
  .choice.incorrect{
    background:var(--bad-soft);
    border-color:var(--bad);
  }
  .choice .tag{
    float:right;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
  }
  .choice.correct .tag{color:var(--good);}
  .choice.incorrect .tag{color:var(--bad);}
  /* AI support */
  .ai-btn{
    width:100%;
    margin:14px 0 0;
    background:var(--sun);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:13px 16px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    letter-spacing:.01em;
  }
  .ai-btn:hover{background:#a8481f;}
  .ai-btn .bolt{font-size:16px;}
  .ai-panel{
    margin-top:12px;
    background:var(--sun-soft);
    border:1px solid #e3b89c;
    border-radius:12px;
    padding:16px 18px;
    font-size:14.5px;
    display:none;
  }
  .ai-panel.open{display:block;}
  .ai-panel h4{
    margin:0 0 6px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:#7a3216;
  }
  .ai-panel p{margin:0 0 14px;}
  .ai-panel .vocab-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px dashed #e3b89c;
    font-size:14px;
  }
  .ai-panel .vocab-row:last-of-type{border-bottom:none;}
  .ai-panel .vocab-jp{font-weight:600;white-space:nowrap;}
  .ai-panel .vocab-en{color:#5e4030;text-align:right;}
  .ai-panel .grammar-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #e3b89c;
  }
  .next-btn{
    width:100%;
    margin-top:18px;
    background:var(--umi);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px 16px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .next-btn:disabled{
    background:#bcc6cb;
    cursor:not-allowed;
  }
  /* ---------- result screen ---------- */
  .score-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 20px;
    text-align:center;
    margin-bottom:18px;
  }
  .score-card .big{
    font-size:42px;
    font-weight:700;
    color:var(--umi);
  }
  .score-card .small{
    color:var(--ink-soft);
    font-size:14px;
    margin-top:4px;
  }
  .weak-section h3{
    font-size:15px;
    margin:0 0 10px;
  }
  .weak-item{
    background:var(--bad-soft);
    border:1px solid #e0c3bf;
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:14px;
  }
  .weak-item .sit{font-weight:600;color:var(--bad);display:block;margin-bottom:3px;}
  .weak-item .vocabline{color:#6b4b46;font-size:13px;}
  .clean-msg{
    background:var(--good-soft);
    border:1px solid #c4d8bd;
    border-radius:10px;
    padding:14px 16px;
    text-align:center;
    font-size:14px;
    color:var(--good);
    font-weight:600;
  }
  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:18px;
  }
  .btn-primary{
    background:var(--sun);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--ink);
    border-radius:12px;
    padding:14px;
    font-size:15px;
    cursor:pointer;
  }
  .btn-secondary:hover{border-color:var(--umi);}
  footer{
    margin-top:40px;
    border-top:1px solid var(--line);
    padding-top:16px;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
  }
  footer a{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    .island,.progress-fill{transition:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
