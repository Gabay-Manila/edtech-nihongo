<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edtech-nihongo | Adaptive Survival Japanese</title>
<meta name="description" content="English-first adaptive Japanese learning — 4 blocks, AI Support hints, weak-point review loop.">
<style>
  :root{
    --bg:#fdfcf0;
    --card:#fffefa;
    --ink:#2b2a25;
    --ink-soft:#6b6a5e;
    --line:#e7e3cf;
    --umi:#2f4858;          /* deep indigo-sea — primary accent */
    --umi-soft:#dfe7ea;
    --sun:#c1572f;          /* terracotta — CTA / hint accent */
    --sun-soft:#f6e3d8;
    --good:#5c7a52;
    --good-soft:#e7efe1;
    --bad:#a64b42;
    --bad-soft:#f3e3e0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .jp{
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    padding:22px 18px 60px;
    min-height:100vh;
  }
  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .brand{
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .brand b{color:var(--umi);}
  .tonefreq{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .wave{
    width:100%;
    height:18px;
    margin:10px 0 26px;
    display:block;
  }
  /* ---------- home screen ---------- */
  .hero h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  .hero p{
    color:var(--ink-soft);
    margin:0 0 22px;
    font-size:15px;
    max-width:540px;
  }
  .islands{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:480px){
    .islands{grid-template-columns:1fr;}
  }
  .island{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px;
    cursor:pointer;
    text-align:left;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    box-shadow:0 1px 0 rgba(43,42,37,.03);
  }
  .island:hover{
    transform:translateY(-2px);
    border-color:var(--umi);
    box-shadow:0 8px 20px -10px rgba(47,72,88,.35);
  }
  .island:focus-visible{outline:3px solid var(--umi);outline-offset:2px;}
  .island .lvl{
    display:inline-block;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--umi);
    background:var(--umi-soft);
    padding:3px 8px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .island h2{
    margin:0 0 4px;
    font-size:19px;
  }
  .island .jp-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .island .meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .island .best{color:var(--good);font-weight:600;}
  /* ---------- quiz screen ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .back-link{
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    background:none;
    border:none;
    padding:6px 0;
  }
  .back-link:hover{color:var(--umi);}
  .progress-track{
    height:6px;
    background:var(--umi-soft);
    border-radius:999px;
    overflow:hidden;
    margin:10px 0 20px;
  }
  .progress-fill{
    height:100%;
    background:var(--umi);
    border-radius:999px;
    transition:width .25s ease;
  }
  .review-banner{
    background:var(--sun-soft);
    border:1px solid var(--sun);
    color:#7a3216;
    font-size:13px;
    padding:8px 12px;
    border-radius:10px;
    margin-bottom:16px;
  }
  .situation-en{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--umi-soft);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .situation-en b{color:var(--umi);}
  .prompt-jp{
    font-size:22px;
    margin:0 0 18px;
    line-height:1.5;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }
  .choice{
    text-align:left;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:13px 16px;
    font-size:17px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover:not(:disabled){border-color:var(--umi);}
  .choice:disabled{cursor:default;}
  .choice.correct{
    background:var(--good-soft);
    border-color:var(--good);
  }
  .choice.incorrect{
    background:var(--bad-soft);
    border-color:var(--bad);
  }
  .choice .tag{
    float:right;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
  }
  .choice.correct .tag{color:var(--good);}
  .choice.incorrect .tag{color:var(--bad);}
  /* AI support */
  .ai-btn{
    width:100%;
    margin:14px 0 0;
    background:var(--sun);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:13px 16px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    letter-spacing:.01em;
  }
  .ai-btn:hover{background:#a8481f;}
  .ai-btn .bolt{font-size:16px;}
  .ai-panel{
    margin-top:12px;
    background:var(--sun-soft);
    border:1px solid #e3b89c;
    border-radius:12px;
    padding:16px 18px;
    font-size:14.5px;
    display:none;
  }
  .ai-panel.open{display:block;}
  .ai-panel h4{
    margin:0 0 6px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:#7a3216;
  }
  .ai-panel p{margin:0 0 14px;}
  .ai-panel .vocab-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px dashed #e3b89c;
    font-size:14px;
  }
  .ai-panel .vocab-row:last-of-type{border-bottom:none;}
  .ai-panel .vocab-jp{font-weight:600;white-space:nowrap;}
  .ai-panel .vocab-en{color:#5e4030;text-align:right;}
  .ai-panel .grammar-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #e3b89c;
  }
  .next-btn{
    width:100%;
    margin-top:18px;
    background:var(--umi);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px 16px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .next-btn:disabled{
    background:#bcc6cb;
    cursor:not-allowed;
  }
  /* ---------- result screen ---------- */
  .score-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 20px;
    text-align:center;
    margin-bottom:18px;
  }
  .score-card .big{
    font-size:42px;
    font-weight:700;
    color:var(--umi);
  }
  .score-card .small{
    color:var(--ink-soft);
    font-size:14px;
    margin-top:4px;
  }
  .weak-section h3{
    font-size:15px;
    margin:0 0 10px;
  }
  .weak-item{
    background:var(--bad-soft);
    border:1px solid #e0c3bf;
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:14px;
  }
  .weak-item .sit{font-weight:600;color:var(--bad);display:block;margin-bottom:3px;}
  .weak-item .vocabline{color:#6b4b46;font-size:13px;}
  .clean-msg{
    background:var(--good-soft);
    border:1px solid #c4d8bd;
    border-radius:10px;
    padding:14px 16px;
    text-align:center;
    font-size:14px;
    color:var(--good);
    font-weight:600;
  }
  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:18px;
  }
  .btn-primary{
    background:var(--sun);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-secondary{
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--ink);
    border-radius:12px;
    padding:14px;
    font-size:15px;
    cursor:pointer;
  }
  .btn-secondary:hover{border-color:var(--umi);}
  footer{
    margin-top:40px;
    border-top:1px solid var(--line);
    padding-top:16px;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
  }
  footer a{color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){
    .island,.progress-fill{transition:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   edtech-nihongo — English-first Adaptive Survival Japanese
   4 islands × shuffled quiz × AI Support (English) × weak-point loop
   Yoshida EdTech Works — cream/437Hz brand
   ========================================================= */

/* ---------- content data ---------- */
const BLOCKS = [
  {
    id:"starter", title:"Starter", jp:"スターター", level:"A1",
    blurb:"Greetings, self-introduction, food & basic shopping.",
    questions:[
      {id:"st1", situation:"It's morning. You greet a neighbor in the hallway.",
       prompt:"あなたは　なんと　いいますか？",
       choices:[
         {jp:"おはようございます", correct:true},
         {jp:"こんばんは", correct:false},
         {jp:"さようなら", correct:false},
         {jp:"すみません", correct:false}],
       ai:{situation:"Japanese greetings change with the time of day. Morning greetings are short, frequent, and expected even with people you barely know — like coworkers in a hallway.",
           vocab:[{jp:"おはようございます",en:"Good morning (polite)"},{jp:"こんばんは",en:"Good evening"},{jp:"さようなら",en:"Goodbye"},{jp:"すみません",en:"Excuse me / Sorry"}],
           grammar:"Greetings are fixed phrases tied to time of day. おはようございます covers early morning through late morning."}},
      {id:"st2", situation:"Someone asks where you're from. You are from the Philippines.",
       prompt:"Q：おくには　どちらですか？",
       choices:[
         {jp:"フィリピンから　きました", correct:true},
         {jp:"にほんごが　すきです", correct:false},
         {jp:"ありがとうございます", correct:false},
         {jp:"はじめまして", correct:false}],
       ai:{situation:"おくに is a polite way to ask someone's home country. It's one of the very first questions asked in self-introductions in Japan.",
           vocab:[{jp:"おくに",en:"country (polite)"},{jp:"どちら",en:"where / which way"},{jp:"〜から きました",en:"came from 〜"},{jp:"フィリピン",en:"Philippines"}],
           grammar:"Country/place name + から きました means 'I came from 〜'. This is the standard pattern for stating origin."}},
      {id:"st3", situation:"Someone asks if you like udon. You do.",
       prompt:"Q：うどんが　すきですか？",
       choices:[
         {jp:"はい、すきです", correct:true},
         {jp:"いいえ、げんきです", correct:false},
         {jp:"すみません、わかりません", correct:false},
         {jp:"はじめまして", correct:false}],
       ai:{situation:"Talking about food preferences is one of the most common small-talk topics in Japan, especially when getting to know coworkers.",
           vocab:[{jp:"すき",en:"like / fond of"},{jp:"はい / いいえ",en:"yes / no"}],
           grammar:"〜が すきです means 'I like 〜'. が marks the thing being liked — it is not the doer of an action."}},
      {id:"st4", situation:"A fast-food staff member asks what you'd like to order. You want a cheeseburger.",
       prompt:"Q：ご注文は？",
       choices:[
         {jp:"チーズバーガーを　ください", correct:true},
         {jp:"チーズバーガーが　あります", correct:false},
         {jp:"チーズバーガーじゃ　ありません", correct:false},
         {jp:"チーズバーガーでした", correct:false}],
       ai:{situation:"〜を ください is the single most useful phrase for ordering food or buying something — it works in restaurants, convenience stores, and markets alike.",
           vocab:[{jp:"〜を ください",en:"please give me 〜"},{jp:"ちゅうもん（注文）",en:"order"}],
           grammar:"Noun + を ください is the simplest polite way to request or order something."}},
      {id:"st5", situation:"You didn't catch what someone said and need to admit you don't understand.",
       prompt:"Q：あなたは　にほんごが　わかりませんでした。なんと　いいますか？",
       choices:[
         {jp:"すみません、わかりません", correct:true},
         {jp:"どうも　ありがとう", correct:false},
         {jp:"おやすみなさい", correct:false},
         {jp:"おねがいします", correct:false}],
       ai:{situation:"It's completely normal and accepted for beginners to say this — it's far better than guessing or staying silent.",
           vocab:[{jp:"わかりません",en:"I don't understand / don't know"},{jp:"すみません",en:"excuse me / sorry"}],
           grammar:"すみません softens almost any statement, including admitting you didn't understand something."}},
      {id:"st6", situation:"You want to ask the price of an item in a shop.",
       prompt:"Q：これは　いくらですか？",
       choices:[
         {jp:"ごひゃくえんです", correct:true},
         {jp:"おいしいです", correct:false},
         {jp:"げんきです", correct:false},
         {jp:"どういたしまして", correct:false}],
       ai:{situation:"いくらですか is the question; the answer is simply a number plus えん (yen).",
           vocab:[{jp:"いくら",en:"how much"},{jp:"〜えん",en:"〜 yen"}],
           grammar:"いくらですか？ asks the price. Number + えん gives the answer, e.g. ごひゃくえん = 500 yen."}},
      {id:"st7", situation:"It's late at night and you're leaving work before your coworkers.",
       prompt:"Q：よる　おそく　かいしゃを　でます。なんと　いいますか？",
       choices:[
         {jp:"おさきに　しつれいします", correct:true},
         {jp:"おはようございます", correct:false},
         {jp:"いただきます", correct:false},
         {jp:"ごちそうさまでした", correct:false}],
       ai:{situation:"お先に失礼します is said almost automatically when leaving a Japanese workplace before others — even close coworkers expect to hear it.",
           vocab:[{jp:"おさきに しつれいします",en:"\"Excuse me for leaving first\" (fixed workplace phrase)"}],
           grammar:"This is a set phrase — memorize it as one chunk rather than analyzing its grammar piece by piece."}},
      {id:"st8", situation:"Someone helped you with something. You want to thank them politely.",
       prompt:"Q：てつだって　もらいました。なんと　いいますか？",
       choices:[
         {jp:"ありがとうございます", correct:true},
         {jp:"すみません", correct:false},
         {jp:"さようなら", correct:false},
         {jp:"いいえ", correct:false}],
       ai:{situation:"ありがとうございます is appropriate in nearly every formal or service situation in Japan, from a shop clerk to a supervisor.",
           vocab:[{jp:"てつだう",en:"to help"},{jp:"ありがとうございます",en:"thank you (polite)"}],
           grammar:"This is the standard polite thank-you — safe to use in almost any context."}}
    ]
  },
  {
    id:"elem1", title:"Elementary 1", jp:"初級１", level:"A2.1",
    blurb:"Workplace requests, home, daily schedules.",
    questions:[
      {id:"e1_1", situation:"Your coworker Yamada is not at his desk. Someone asks where he is. He's in the meeting room.",
       prompt:"Q：やまださんは　どこですか？",
       choices:[
         {jp:"やまださんは　かいぎしつに　います", correct:true},
         {jp:"やまださんは　げんきです", correct:false},
         {jp:"やまださんは　にほんじんです", correct:false},
         {jp:"やまださんは　いきました", correct:false}],
       ai:{situation:"Saying where a colleague currently is, is a very common workplace exchange — especially when answering a phone call or a visitor's question.",
           vocab:[{jp:"かいぎしつ",en:"meeting room"},{jp:"〜に います",en:"is at / in 〜 (for people, animals)"}],
           grammar:"〜は〜に います states where a living thing is located. います is for people/animals; あります is for objects and places."}},
      {id:"e1_2", situation:"You need to borrow a stapler from a coworker's desk.",
       prompt:"Q：ホッチキスを　かりたいです。なんと　いいますか？",
       choices:[
         {jp:"ホッチキスを　かして　ください", correct:true},
         {jp:"ホッチキスを　かりて　ください", correct:false},
         {jp:"ホッチキスです", correct:false},
         {jp:"ホッチキスを　あげます", correct:false}],
       ai:{situation:"This question tests a classic beginner mix-up: かす (to lend) vs かりる (to borrow). You ask someone else to かす (lend) it to you.",
           vocab:[{jp:"かす",en:"to lend"},{jp:"かりる",en:"to borrow"},{jp:"〜て ください",en:"please do 〜"}],
           grammar:"〜て ください is the basic polite request form. かして ください = 'please lend (it to) me' — the verb is かす, not かりる."}},
      {id:"e1_3", situation:"Someone asks how many rooms your apartment has. You have four.",
       prompt:"Q：アパートに　へやが　いくつ　ありますか？",
       choices:[
         {jp:"へやが　よっつ　あります", correct:true},
         {jp:"へやが　よにん　います", correct:false},
         {jp:"へやが　よじです", correct:false},
         {jp:"へやは　おおきいです", correct:false}],
       ai:{situation:"Japanese uses special counting words depending on what's being counted — rooms use a different counter than people or hours.",
           vocab:[{jp:"へや",en:"room"},{jp:"よっつ",en:"four (general object counter)"},{jp:"あります",en:"to exist / have (for things)"}],
           grammar:"よっつ is the counter for four general objects. Use あります (not います) because rooms aren't living things."}},
      {id:"e1_4", situation:"A new employee asks what time lunch break is. It runs from 12:00 to 13:00.",
       prompt:"Q：ひるやすみは　なんじから　なんじまでですか？",
       choices:[
         {jp:"じゅうにじから　いちじまでです", correct:true},
         {jp:"いちじから　じゅうにじまでです", correct:false},
         {jp:"げつようびから　きんようびまでです", correct:false},
         {jp:"じゅうにじはんです", correct:false}],
       ai:{situation:"Stating work hours and break times accurately is an everyday workplace necessity.",
           vocab:[{jp:"ひるやすみ",en:"lunch break"},{jp:"〜から〜まで",en:"from 〜 to 〜"}],
           grammar:"〜から〜まで marks a range: 'starting point から, ending point まで'. Works for both time and place."}},
      {id:"e1_5", situation:"You're asked your work schedule today and need to say you finish at 6pm.",
       prompt:"Q：きょうは　なんじまで　しごとですか？",
       choices:[
         {jp:"ろくじまでです", correct:true},
         {jp:"ろくじかんです", correct:false},
         {jp:"ろくがつです", correct:false},
         {jp:"ろくにんです", correct:false}],
       ai:{situation:"This question targets a classic listening trap: similar-sounding counters with very different meanings.",
           vocab:[{jp:"〜じ",en:"〜 o'clock (a point in time)"},{jp:"〜じかん",en:"〜 hours (a duration)"},{jp:"〜がつ",en:"month of the year"}],
           grammar:"じ (point in time), じかん (duration), and がつ (calendar month) sound alike but mean very different things — listen carefully."}},
      {id:"e1_6", situation:"You're shopping and need batteries. They're on the 2nd floor.",
       prompt:"Q：でんちは　どこに　ありますか？",
       choices:[
         {jp:"にかいに　あります", correct:true},
         {jp:"にかいに　います", correct:false},
         {jp:"にかいです、げんきです", correct:false},
         {jp:"でんちは　たかいです", correct:false}],
       ai:{situation:"Asking and answering where an item is sold is common when shopping in larger Japanese stores with multiple floors.",
           vocab:[{jp:"でんち",en:"battery"},{jp:"にかい",en:"2nd floor"}],
           grammar:"あります confirms location for objects, not います — batteries are things, not living beings."}},
      {id:"e1_7", situation:"You want to ask the price of a jacket. It's 3,000 yen.",
       prompt:"Q：この　ジャケットは　いくらですか？",
       choices:[
         {jp:"さんぜんえんです", correct:true},
         {jp:"さんがつです", correct:false},
         {jp:"さんにんです", correct:false},
         {jp:"さんじかんです", correct:false}],
       ai:{situation:"Recognizing number + counter combinations quickly is essential for everyday shopping.",
           vocab:[{jp:"〜えん",en:"〜 yen"},{jp:"ジャケット",en:"jacket"}],
           grammar:"Large numbers + えん express prices, e.g. さんぜん = 3,000."}},
      {id:"e1_8", situation:"Your manager asks you to make copies. You accept the instruction politely.",
       prompt:"Q：じょうしに「コピーを　とって　ください」と　いわれました。なんと　へんじしますか？",
       choices:[
         {jp:"はい、わかりました", correct:true},
         {jp:"いいえ、けっこうです", correct:false},
         {jp:"ごちそうさまでした", correct:false},
         {jp:"おさきに　しつれいします", correct:false}],
       ai:{situation:"Responding clearly when given an instruction from a superior is an important workplace habit in Japan.",
           vocab:[{jp:"わかりました",en:"understood / got it"},{jp:"けっこうです",en:"no thank you / that's fine (declining)"}],
           grammar:"はい、わかりました is the standard polite response when accepting an instruction."}}
    ]
  },
  {
    id:"elem2", title:"Elementary 2", jp:"初級２", level:"A2.2",
    blurb:"Getting around town, shopping, invitations, hobbies.",
    questions:[
      {id:"e2_1", situation:"You're on a bus and want to confirm it goes to the airport.",
       prompt:"Q：このバスは　くうこうに　いきますか？",
       choices:[
         {jp:"はい、いきます", correct:true},
         {jp:"はい、います", correct:false},

/* ---------- storage ---------- */
const STORE_KEY = "edtechnihongo_progress_v2";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(blockId, score, total, weakIds){
  const p = loadProgress();
  const prev = p[blockId] || {bestScore:0, bestTotal:total, attempts:0};
  p[blockId] = {
    bestScore: Math.max(prev.bestScore||0, score),
    bestTotal: total,
    attempts: (prev.attempts||0) + 1,
    lastWeakIds: weakIds,
    lastAt: new Date().toISOString()
  };
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
}

/* ---------- audio (437Hz brand tone) ---------- */
let audioCtx = null;
function tone(freq, ms, type){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + ms/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + ms/1000 + 0.02);
  }catch(e){ /* silent fail on unsupported browsers */ }
}
function playCorrect(){ tone(437, 220, "sine"); }
function playIncorrect(){ tone(218.5, 260, "sine"); }

/* ---------- helpers ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getBlock(id){ return BLOCKS.find(b=>b.id===id); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

/* ---------- state ---------- */
let state = {
  screen:"home",
  blockId:null,
  queue:[],
  index:0,
  score:0,
  wrong:[],          // question objects answered wrong this run
  reviewMode:false,
  answered:false,
  hintOpen:false
};

/* ---------- rendering ---------- */
const app = document.getElementById("app");

function waveSvg(){
  return '<svg class="wave" viewBox="0 0 600 18" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M0 9 Q 25 0 50 9 T 100 9 T 150 9 T 200 9 T 250 9 T 300 9 T 350 9 T 400 9 T 450 9 T 500 9 T 550 9 T 600 9" '+
    'fill="none" stroke="#2f4858" stroke-width="1.4" stroke-opacity="0.35"/></svg>';
}

function renderHome(){
  const progress = loadProgress();
  const islands = BLOCKS.map(b=>{
    const p = progress[b.id];
    const bestLine = p ? `Best: ${p.bestScore}/${p.bestTotal}` : "Not started yet";
    return `
      <button class="island" data-block="${b.id}">
        <span class="lvl">${b.level}</span>
        <h2 class="jp">${b.jp}</h2>
        <div class="jp-label">${b.title}</div>
        <div style="font-size:13px;color:var(--ink-soft)">${b.blurb}</div>
        <div class="meta">
          <span>${b.questions.length} questions</span>
          <span class="${p?'best':''}">${bestLine}</span>
        </div>
      </button>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><b>edtech-nihongo</b> · adaptive survival japanese</div>
      <div class="tonefreq">437Hz</div>
    </div>
    ${waveSvg()}
    <div class="hero">
      <h1>Pick an island. Learn by situation, not by chapter.</h1>
      <p>Every quiz shows the English context first. Tap <b>AI Support</b> any time you need the situation, vocabulary, or grammar explained in plain English before you choose.</p>
    </div>
    <div class="islands">${islands}</div>
    <footer>
      Yoshida EdTech Works / EdTech Gabay — built for Filipino learners of survival Japanese.<br>
      Progress is saved on this device only. No data is sent to any server.
    </footer>
  `;

  app.querySelectorAll(".island").forEach(el=>{
    el.addEventListener("click", ()=> startBlock(el.dataset.block));
  });
}

function startBlock(blockId, reviewIds){
  const block = getBlock(blockId);
  let pool = block.questions;
  if(reviewIds && reviewIds.length){
    pool = block.questions.filter(q=> reviewIds.includes(q.id));
    state.reviewMode = true;
  } else {
    state.reviewMode = false;
  }
  state.screen = "quiz";
  state.blockId = blockId;
  state.queue = shuffle(pool);
  state.index = 0;
  state.score = 0;
  state.wrong = [];
  state.answered = false;
  state.hintOpen = false;
  renderQuiz();
}

function renderQuiz(){
  const block = getBlock(state.blockId);
  const q = state.queue[state.index];
  const pct = Math.round((state.index/state.queue.length)*100);

  const choicesHtml = q.choices.map((c,i)=>`
    <button class="choice" data-idx="${i}">${c.jp}<span class="tag"></span></button>
  `).join("");

  app.innerHTML = `
    <div class="quiz-top">
      <button class="back-link" id="backBtn">&larr; ${block.title}</button>
      <div class="tonefreq">${state.index+1} / ${state.queue.length}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${state.reviewMode ? `<div class="review-banner">Weak-point review: redoing the questions you missed last time, with AI Support handy.</div>` : ""}
    <div class="situation-en"><b>Situation:</b> ${escapeHtml(q.situation)}</div>
    <p class="prompt-jp jp">${q.prompt}</p>
    <div class="choices">${choicesHtml}</div>

    <button class="ai-btn" id="aiBtn"><span class="bolt">💡</span> AI Support (Hint)</button>
    <div class="ai-panel" id="aiPanel">
      <h4>Situation</h4>
      <p>${escapeHtml(q.ai.situation)}</p>
      <h4>Key vocabulary</h4>
      ${q.ai.vocab.map(v=>`<div class="vocab-row"><span class="vocab-jp jp">${v.jp}</span><span class="vocab-en">${escapeHtml(v.en)}</span></div>`).join("")}
      <div class="grammar-box">
        <h4>Grammar point</h4>
        <p style="margin:0;">${escapeHtml(q.ai.grammar)}</p>
      </div>
    </div>

    <button class="next-btn" id="nextBtn" disabled>Next</button>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; renderHome(); });

  const aiBtn = document.getElementById("aiBtn");
  const aiPanel = document.getElementById("aiPanel");
  aiBtn.addEventListener("click", ()=>{
    aiPanel.classList.toggle("open");
  });

  const choiceButtons = app.querySelectorAll(".choice");
  choiceButtons.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(state.answered) return;
      state.answered = true;
      const idx = Number(btn.dataset.idx);
      const picked = q.choices[idx];
      choiceButtons.forEach((b,i)=>{
        b.disabled = true;
        if(q.choices[i].correct){
          b.classList.add("correct");
          b.querySelector(".tag").textContent = "CORRECT";
        }
      });
      if(picked.correct){
        state.score++;
        playCorrect();
      } else {
        btn.classList.add("incorrect");
        btn.querySelector(".tag").textContent = "YOUR ANSWER";
        playIncorrect();
        if(!state.wrong.find(w=>w.id===q.id)) state.wrong.push(q);
      }
      document.getElementById("nextBtn").disabled = false;
    });
  });

  document.getElementById("nextBtn").addEventListener("click", ()=>{
    state.index++;
    state.answered = false;
    if(state.index >= state.queue.length){
      renderResult();
    } else {
      renderQuiz();
    }
  });
}

function renderResult(){
  const block = getBlock(state.blockId);
  const total = state.queue.length;
  saveProgress(state.blockId, state.score, total, state.wrong.map(w=>w.id));

  let weakHtml = "";
  if(state.wrong.length === 0){
    weakHtml = `<div class="clean-msg">${state.reviewMode ? "Weak points cleared! Nice work." : "No weak points this round — full marks."}</div>`;
  } else {
    weakHtml = `
      <div class="weak-section">
        <h3>Weak points to review (in English)</h3>
        ${state.wrong.map(w=>`
          <div class="weak-item">
            <span class="sit">${escapeHtml(w.situation)}</span>
            <span class="vocabline">Key term: ${w.ai.vocab[0] ? escapeHtml(w.ai.vocab[0].jp + " — " + w.ai.vocab[0].en) : ""} · Grammar: ${escapeHtml(w.ai.grammar.split(".")[0])}.</span>
          </div>
        `).join("")}
      </div>
    `;
  }

  const showRetryWeak = state.wrong.length > 0;

  app.innerHTML = `
    <div class="quiz-top">
      <button class="back-link" id="backBtn">&larr; ${block.title}</button>
      <div class="tonefreq">437Hz</div>
    </div>
    ${waveSvg()}
    <div class="score-card">
      <div class="big">${state.score} / ${total}</div>
      <div class="small">${block.jp} · ${block.level}${state.reviewMode ? " · review run" : ""}</div>
    </div>
    ${weakHtml}
    <div class="result-actions">
      ${showRetryWeak ? `<button class="btn-primary" id="retryWeakBtn">Redo weak points now (with AI Support)</button>` : ""}
      <button class="btn-secondary" id="retryAllBtn">Retry full ${block.title} set</button>
      <button class="btn-secondary" id="homeBtn">Back to islands</button>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ state.screen="home"; renderHome(); });
  document.getElementById("homeBtn").addEventListener("click", ()=>{ state.screen="home"; renderHome(); });
  document.getElementById("retryAllBtn").addEventListener("click", ()=> startBlock(state.blockId));
  if(showRetryWeak){
    document.getElementById("retryWeakBtn").addEventListener("click", ()=>{
      startBlock(state.blockId, state.wrong.map(w=>w.id));
    });
  }
}

/* ---------- boot ---------- */
renderHome();
</script>
